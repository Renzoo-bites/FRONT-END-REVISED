<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Light or dark before the page draws: the saved choice, else the device setting -->
  <script>(function () { var t; try { t = localStorage.getItem("findit.theme"); } catch (e) {} document.documentElement.dataset.theme = t === "dark" || t === "light" ? t : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); })();</script>
  <title>FindIt Admin | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="../js/auth.js"></script>
  <script>Auth.requireRole("admin", "../user/login.html?role=admin");</script>
</head>
<body data-page="dashboard">

  <div id="admin-sidebar"></div>

  <div class="admin-main">
    <div id="admin-topbar"></div>

    <main class="admin-content">
      <header class="page-head">
        <h1 id="greeting">Dashboard</h1>
        <p>Here's what's happening on campus today.</p>
      </header>

      <section class="stat-grid" id="stat-grid" aria-label="Today at a glance"></section>

      <div class="chart-grid">
        <section class="admin-card" aria-labelledby="weekly-heading">
          <div class="card-head">
            <h2 id="weekly-heading">Reports this week</h2>
            <ul class="legend" id="weekly-legend"></ul>
          </div>
          <div class="chart-body">
            <div class="chart-canvas">
              <canvas id="weekly-chart" role="img"></canvas>
            </div>
            <details class="chart-table">
              <summary>View as table</summary>
              <div id="weekly-table"></div>
            </details>
          </div>
        </section>

        <section class="admin-card" aria-labelledby="category-heading">
          <div class="card-head">
            <h2 id="category-heading">Items by category</h2>
          </div>
          <div class="chart-body">
            <div class="donut-wrap">
              <canvas id="category-chart" role="img"></canvas>
              <div class="donut-center" id="category-total"></div>
            </div>
            <ul class="category-legend" id="category-legend"></ul>
          </div>
        </section>
      </div>

      <section class="admin-card" aria-labelledby="today-heading">
        <div class="card-head">
          <h2 id="today-heading">Lost items reported today</h2>
          <a href="reports.html" class="card-link">View all <span aria-hidden="true">&rarr;</span></a>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th scope="col">Item</th>
                <th scope="col">Category</th>
                <th scope="col">Location</th>
                <th scope="col">Reported by</th>
                <th scope="col">Status</th>
                <th scope="col">Time</th>
              </tr>
            </thead>
            <tbody id="today-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
  <script src="../js/message-store.js"></script>
  <script src="../js/data/locations.js"></script>
  <script src="../js/item-store.js"></script>
  <script src="../js/claim-store.js"></script>
  <script src="../js/settings-store.js"></script>
  <script src="../js/photos.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/add-item.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
