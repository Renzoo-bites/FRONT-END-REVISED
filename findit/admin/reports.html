<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Light or dark before the page draws: the saved choice, else the device setting -->
  <script>(function () { var t; try { t = localStorage.getItem("findit.theme"); } catch (e) {} document.documentElement.dataset.theme = t === "dark" || t === "light" ? t : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); })();</script>
  <title>FindIt Admin | Reports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="../js/auth.js"></script>
  <script>Auth.requireRole("admin", "../user/login.html?role=admin");</script>
</head>
<body data-page="reports">

  <div id="admin-sidebar"></div>

  <div class="admin-main">
    <div id="admin-topbar"></div>

    <main class="admin-content">
      <header class="page-head">
        <h1>Reports</h1>
        <p>Manage lost and found reports from students.</p>
      </header>

      <div class="reports-layout" id="reports-layout">
        <section class="admin-card" aria-label="Reports list">
          <div class="reports-toolbar">
            <div class="status-tabs" id="status-tabs" role="group" aria-label="Filter by status"></div>

            <div class="toolbar-filters">
              <label class="visually-hidden" for="category-filter">Category</label>
              <select class="admin-select" id="category-filter">
                <option value="">All categories</option>
              </select>

              <label class="visually-hidden" for="date-filter">Date</label>
              <select class="admin-select" id="date-filter">
                <option value="">Any date</option>
              </select>
            </div>
          </div>

          <div class="table-wrap">
            <table class="admin-table reports-table">
              <caption class="visually-hidden">Lost and found reports</caption>
              <thead>
                <tr>
                  <th scope="col" class="check-col">
                    <input type="checkbox" id="select-all" aria-label="Select all reports on this page">
                  </th>
                  <th scope="col">Item</th>
                  <th scope="col">Type</th>
                  <th scope="col">Location</th>
                  <th scope="col">Date</th>
                  <th scope="col">Status</th>
                  <th scope="col"><span class="visually-hidden">Actions</span></th>
                </tr>
              </thead>
              <tbody id="reports-body"></tbody>
            </table>
          </div>

          <div class="table-footer">
            <p id="page-summary" aria-live="polite"></p>
            <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
          </div>
        </section>

        <aside class="admin-card detail-panel" id="detail-panel" tabindex="-1" aria-labelledby="detail-name">
          <div class="detail-head">
            <div>
              <p class="detail-label">Report ID</p>
              <p class="detail-id" id="detail-id"></p>
            </div>
            <button type="button" class="icon-btn" id="detail-close" aria-label="Close details">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          </div>
          <div id="detail-body"></div>
        </aside>
      </div>

      <div class="panel-backdrop" id="panel-backdrop"></div>
    </main>
  </div>

  <script src="../js/message-store.js"></script>
  <script src="../js/data/locations.js"></script>
  <script src="../js/item-store.js"></script>
  <script src="../js/claim-store.js"></script>
  <script src="../js/settings-store.js"></script>
  <script src="../js/photos.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/add-item.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
