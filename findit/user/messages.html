<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Light or dark before the page draws: the saved choice, else the device setting -->
  <script>(function () { var t; try { t = localStorage.getItem("findit.theme"); } catch (e) {} document.documentElement.dataset.theme = t === "dark" || t === "light" ? t : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); })();</script>
  <title>FindIt | Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="../css/chat.css">
  <link rel="stylesheet" href="css/messages.css">
  <!-- Messages are personal: send logged-out visitors to the login page first -->
  <script src="../js/auth.js"></script>
  <script>Auth.requireRole("user", "login.html");</script>
</head>
<body data-page="messages" class="messages-body">

  <div id="navbar"></div>

  <main class="messages-main">
    <div class="messages-app" id="messages-app">
      <section class="convo-panel" aria-labelledby="messages-title">
        <div class="convo-head">
          <h1 id="messages-title">Messages</h1>

          <div class="convo-search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7.5" />
              <path d="m21 21-4.6-4.6" />
            </svg>
            <input type="search" id="convo-search" placeholder="Search Conversations" aria-label="Search conversations">
          </div>

          <div class="convo-filters" id="convo-filters" role="group" aria-label="Filter conversations">
            <button type="button" class="convo-filter" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="convo-filter" data-filter="unread" aria-pressed="false">Unread<span id="unread-total"></span></button>
            <button type="button" class="convo-filter" data-filter="swafo" aria-pressed="false">SWAFO</button>
          </div>
        </div>

        <ul class="convo-list" id="convo-list"></ul>
      </section>

      <section class="thread" aria-label="Conversation">
        <header class="thread-head" id="thread-head"></header>

        <div class="safety-banner">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
            <path d="M12 9v4M12 17h.01" />
          </svg>
          <p>Never share passwords or ID numbers in chat. SWAFO will only ask what is needed to verify.</p>
        </div>

        <div class="thread-messages" id="thread-messages" role="log" aria-live="polite" aria-label="Messages"></div>

        <form class="composer" id="composer">
          <p class="composer-error" id="composer-error" role="alert" hidden></p>
          <div class="attach-preview" id="attach-preview" hidden></div>

          <div class="composer-row">
            <button type="button" class="composer-btn" id="attach-btn" aria-label="Attach a photo">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" />
              </svg>
            </button>
            <input type="file" id="attach-input" accept="image/*" hidden>

            <label class="visually-hidden" for="composer-input">Message</label>
            <textarea id="composer-input" rows="1" placeholder="Write a message..."></textarea>

            <button type="submit" class="send-btn" id="send-btn" aria-label="Send message" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </button>
          </div>
        </form>
      </section>

      <aside class="info-panel" id="info-panel" aria-label="Conversation details"></aside>
      <div class="info-backdrop" id="info-backdrop"></div>
    </div>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="Photo">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close photo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
    <img id="lightbox-img" alt="Shared photo">
  </dialog>

  <script src="js/main.js"></script>
  <script src="../js/data/locations.js"></script>
  <script src="../js/message-store.js"></script>
  <script src="../js/settings-store.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="../js/photos.js"></script>
  <script src="../js/chat-ui.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
