<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Light or dark before the page draws: the saved choice, else the device setting -->
  <script>(function () { var t; try { t = localStorage.getItem("findit.theme"); } catch (e) {} document.documentElement.dataset.theme = t === "dark" || t === "light" ? t : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); })();</script>
  <!-- Opens the home page (index.html). Not used by any page; kept from the old findit/index.html. -->
  <meta http-equiv="refresh" content="0; url=index.html">
  <title>FindIt</title>
</head>
<body>
  <p><a href="index.html">Go to FindIt</a></p>
</body>
</html>
